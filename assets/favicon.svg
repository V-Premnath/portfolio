<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#0a0e1c" />
      <stop offset="100%" stop-color="#0e172e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Monogram Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Code Brackets & Monogram "VP" -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 120 200 L 70 256 L 120 312" fill="none" stroke="#06d6a0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Bracket > -->
    <path d="M 392 200 L 442 256 L 392 312" fill="none" stroke="#a855f7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- "V" Glyph -->
    <path d="M 155 185 L 225 330 L 255 330 L 305 235" fill="none" stroke="url(#textGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- "P" Glyph Overlay -->
    <path d="M 285 330 L 285 185 L 345 185 C 375 185 390 200 390 225 C 390 250 375 265 345 265 L 285 265" fill="none" stroke="url(#textGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Quantum Core Pulse -->
    <circle cx="256" cy="380" r="10" fill="#06d6a0" />
  </g>
</svg>
